name: Post to Bluesky

on:
  workflow_run:
    workflows: ["Generate Blog Post"]
    types: [completed]
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: post-to-bluesky
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  post-to-bluesky:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Don't post links to a site that's down. continue-on-error keeps the job
      # green — the Site Uptime workflow owns alerting for outages.
      - name: Check live site
        id: site
        continue-on-error: true
        run: npx tsx scripts/check-site-up.ts

      # A Bluesky failure fails the job and opens an issue via "Notify on failure".
      - name: Post to Bluesky
        if: steps.site.outcome == 'success'
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: npx tsx scripts/post-to-bluesky.mts

      - name: Commit posted tracker
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f .posted-to-bluesky ]; then git add .posted-to-bluesky; fi
          git diff --cached --quiet || (git commit -m "chore: update social posted tracker" && git pull --rebase origin main && git push)

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = '[Auto] post-to-bluesky failed';
            const label = 'automation-failure';
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `Failed again on ${new Date().toISOString()}.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body: `The \`post-to-bluesky\` workflow failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: [label],
              });
            }
